[project]
name = "research-agent"
version = "0.1.0"
description = "A research agent: plans, searches the web, checks coverage and writes a cited report (LangGraph + Claude)."
authors = [
    { name = "Guilherme Cardoso", email = "cardoso.guivi@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs==9.16.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langchain-anthropic==1.7.5",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "langgraph==1.2.12",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "structlog==25.5.0",
    "tavily-python==0.8.4",
    "tenacity==9.1.4",
    "trafilatura==2.2.0",
    "uvicorn[standard]==0.54.0",
]

license = "MIT"
readme = "README.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
e2e = [
    "playwright==1.63.0",
    "pytest-playwright==0.9.0",
]
studio = [
    "langgraph-cli[inmem]==0.4.32",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "PT", "RET", "C4", "PTH", "TID"]
ignore = ["S101"]  # assert is fine in tests; src code does not rely on asserts

[tool.ruff.lint.isort]
known-first-party = ["research_agent", "evals", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["ddgs.*", "tavily.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live and not e2e'"
markers = [
    "live: hits real paid/external APIs; run with `make test-live`",
    "e2e: browser smoke tests (Playwright); run with `make test-e2e`",
]

[tool.coverage.run]
source = ["src/research_agent"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
