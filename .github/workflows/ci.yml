name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never calls paid APIs: live/e2e tests are deselected by default (see pyproject addopts)
# and no API keys are configured as secrets.
jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container health
        env:
          # Placeholder only: /health does not call the LLM.
          ANTHROPIC_API_KEY: placeholder-not-a-real-key
        run: |
          docker run -d --name api -p 8000:8000 -e ANTHROPIC_API_KEY research-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
